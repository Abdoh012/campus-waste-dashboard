<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10251f" />
    <title>Think Outside The Box · Campus Waste Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the persisted language + direction before first paint, so an
      // Arabic visitor never sees an LTR flash. Keep the storage key in sync
      // with shared/i18n/catalog.ts (LOCALE_STORAGE_KEY).
      (function () {
        try {
          var stored = window.localStorage.getItem('cw.locale');
          var locale =
            stored === 'en' || stored === 'ar'
              ? stored
              : (navigator.language || '').toLowerCase().indexOf('ar') === 0
                ? 'ar'
                : 'en';
          document.documentElement.lang = locale;
          document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr';
        } catch (error) {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
        }
      })();

      // Apply the persisted theme before first paint, so a dark-mode visitor
      // never sees a flash of light content. Keep the storage key in sync with
      // shared/theme/theme.ts (THEME_STORAGE_KEY); `system` follows the OS.
      (function () {
        try {
          var stored = window.localStorage.getItem('cw.theme');
          var preference =
            stored === 'light' || stored === 'dark' || stored === 'system'
              ? stored
              : 'system';
          var dark =
            preference === 'dark' ||
            (preference === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0d1a16' : '#10251f');
        } catch (error) {
          /* Keep the light default. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
